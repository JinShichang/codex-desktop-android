plugins { id 'com.android.library' }
// This module is included by several independent Gradle roots. Its task
// identity differs between them, so incremental merger state must not share
// the source directory's build folder across those roots.
layout.buildDirectory = rootProject.layout.buildDirectory.dir('modules/' + project.name)
def frozenTransportNative = providers.gradleProperty('codexFrozenTransportJni')
def sourceSupportBuild = providers.gradleProperty('codexRuntimeSupportBuild')
if (sourceSupportBuild.isPresent() && !frozenTransportNative.isPresent()) {
    throw new GradleException('Source-built transport requires its explicit frozen JNI directory')
}
android {
    namespace 'com.ai.codex.shizukuexec'
    compileSdk 37
    ndkVersion '29.0.14206865'
    defaultConfig {
        minSdk 30
        targetSdk 37
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
        consumerProguardFiles 'consumer-rules.pro'
    }
    if (frozenTransportNative.isPresent()) {
        sourceSets.main.jniLibs.srcDir(file(frozenTransportNative.get()))
    } else {
        externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    }
    buildFeatures { aidl true }
    sourceSets.main.assets.exclude '**/__pycache__/**'
    // Production supplies this entry only through its explicit pinned package;
    // adding it to legacy qualification APKs would invalidate their inventories.
    sourceSets.main.assets.exclude 'codex-executor/codex_native_bootstrap.py'
    sourceSets.main.assets.exclude 'codex-executor/codex_app_bootstrap.py'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
if (frozenTransportNative.isPresent()) {
    tasks.named('preBuild').configure {
        doFirst {
            def directory = file(frozenTransportNative.get()).canonicalFile
            def expected = [
                'arm64-v8a/libcodex_shizuku_transport.so': 'd4bb423a0dbe354485337d947bec486d6012d7b37a2ae0d73d0def8f26fe4ca6',
                'arm64-v8a/libcodex_bionic_cwd.so': 'f65702d47130bf8f3098e7b9a5da5d982bbbc0d20cf50eeb61cc5fd489237157'
            ]
            if (sourceSupportBuild.isPresent()) {
                def build = file(sourceSupportBuild.get()).canonicalFile
                def hash = { File input -> java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString() }
                def record = new groovy.json.JsonSlurper().parse(new File(build, 'build.json'))
                if (record.schema != 'codex.native-support-build.v1' || record.androidExecuted != false
                        || record.reproducible != true || record.ndk != '29.0.14206865' || record.apiLevel != 35) {
                    throw new GradleException('Unsupported source-built transport evidence')
                }
                def sourcesFile = new File(build, 'sources.json')
                if (hash(sourcesFile) != record.sourceManifestSha256) throw new GradleException('Source-built transport source inventory differs')
                def sources = new groovy.json.JsonSlurper().parse(sourcesFile)
                def sourceRoot = projectDir
                while (sourceRoot != null && !new File(sourceRoot, 'tools/executor/runas-runtime/build-runtime-support.py').isFile()) {
                    sourceRoot = sourceRoot.parentFile
                }
                if (sourceRoot == null) throw new GradleException('Cannot locate current runtime support sources')
                def currentSources = [
                    'native-files.c': 'tools/executor/native-files.c',
                    'native-file-handle.c': 'tools/executor/native-file-handle.c',
                    'native-runner-seccomp.h': 'tools/executor/native-runner-seccomp.h',
                    'spawn.c': 'tools/executor/shizuku-service/transport/src/main/cpp/spawn.c',
                    'cwd.c': 'tools/executor/bionic-cwd/cwd.c',
                    'exports.map': 'tools/executor/bionic-cwd/exports.map',
                    'build-runtime-support.py': 'tools/executor/runas-runtime/build-runtime-support.py',
                    'android_ndk_host.py': 'tools/executor/android_ndk_host.py',
                    'check-elf.py': 'tools/executor/bionic-runtime/shizuku-check-elf.py',
                    'inspect-elf.py': 'tools/executor/stage-android-python.py'
                ]
                if (sources.size() != currentSources.size() || sources.collect { it.path }.toSet() != currentSources.keySet()) {
                    throw new GradleException('Source-built transport has an unexpected source inventory')
                }
                sources.each { row ->
                    def frozen = new File(build, 'source/' + row.path)
                    if (hash(frozen) != row.sha256 || frozen.length() != row.bytes
                            || hash(new File(sourceRoot, currentSources[row.path])) != row.sha256) {
                        throw new GradleException('Source-built transport differs from current source: ' + row.path)
                    }
                }
                expected = expected.collectEntries { relative, oldHash ->
                    def name = new File(relative).name
                    def rows = record.binaries.findAll { it.name == name }
                    if (rows.size() != 1 || rows[0].realRecompilationIdentical != true
                            || hash(new File(build, name)) != rows[0].sha256
                            || hash(new File(build, 'repeat/' + name)) != rows[0].sha256) {
                        throw new GradleException('Source-built transport lacks matching real recompilation: ' + name)
                    }
                    [(relative): rows[0].sha256]
                }
            }
            def actual = fileTree(directory).files.collect {
                directory.toPath().relativize(it.toPath()).toString().replace('\\', '/')
            }.toSet()
            if (actual != expected.keySet()) throw new GradleException('Frozen JNI inputs have unexpected or missing files')
            expected.each { relative, digest ->
                def source = new File(directory, relative)
                def sha = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
                if (sha != digest) throw new GradleException('Frozen JNI input differs from reviewed standalone APK: ' + relative)
            }
        }
    }
}
dependencies {
    compileOnly 'androidx.annotation:annotation:1.3.0'
    api 'dev.rikka.shizuku:api:13.1.5'
    api 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
}
